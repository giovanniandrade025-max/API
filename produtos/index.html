<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="/produtos/style.css" />
  </head>

  <body>
    <!-- HEADER  -->
    <header>
      <div>
        <h1>Delivery Lanchonete</h1>
        <p>Controle de pedidos</p>
      </div>
    </header>

    <main class="conteudo">
      <!-- FORMULARIO -->
      <section>
        <h2>Cadastro de pedidos</h2>
        <form id="form">
          <input type="hidden" id="id" />
          <div class="campos">
            <div>
              <label> Cliente</label>
              <input type="text" id="" />
            </div>

            <div>
              <label> Telefone</label>
              <input type="number" id="" />
            </div>

            <div>
              <label> Endereço</label>
              <input type="text" id="" />
            </div>

            <div>
              <label> Pedido</label>
              <input type="number" id="" />
            </div>

            <div>
              <label> Quantidade</label>
              <input type="number" id="" />
            </div>
          </div>
        </form>
      </section>
      <!-- TABELA -->
      <section>
        <h2>Pedidos</h2>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Endereço</th>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Total</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
